version: 2

# Actions are pinned by commit SHA; Dependabot keeps the SHAs and the "# vX.Y.Z" comments current.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Babel 8 requires Node ^22.18 || >=24.11, but the API supports Node 18 (engines and CI matrix).
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The runtime image must be a Node line the CI matrix tests (18-24): a new major is a deliberate change.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
